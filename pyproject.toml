[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-ci"
version = "0.1.0"
description = "Deterministic RAG faithfulness and hallucination regression gate for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
rag-eval-ci = "rag_eval_ci.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=rag_eval_ci --cov-report=term-missing"
